user nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 8080;
        http2 on; # Исправили предупреждение Nginx для новых версий

        location /auth.AuthService/ {
            # Берем ID из HTTP-заголовка клиента, либо генерируем внутренний id от Nginx
            grpc_set_header x-request-id $http_x_request_id; 
            
            grpc_pass grpc://auth-app:50051;
        }
    }
}
