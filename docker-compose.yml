networks:
  auth-network:
    name: auth-shared-network
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_database
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # Проверка, что Postgres готов принимать соединения
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_database"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  # Контейнер для автоматического наката миграций
  migrations:
    image: migrate/migrate
    container_name: auth-migrations
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://auth_user:auth_password@postgres:5432/auth_database?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-network

  redis:
    image: redis:7-alpine
    container_name: auth-cache
    ports:
      - "6379:6379"
    networks:
      - auth-network

  auth-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - DB_DSN=postgres://auth_user:auth_password@postgres:5432/auth_database?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=your_super_secret_key_123
      - PORT=:50051
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully # Ждем, пока миграции успешно завершатся
      redis:
        condition: service_started
    networks:
      - auth-network

  nginx:
    image: nginx:alpine
    container_name: auth-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - auth-app
    networks:
      - auth-network

volumes:
  pgdata:
